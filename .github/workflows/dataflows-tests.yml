name: dataflows-tests

on:
  pull_request:
    branches:
      - release
      - release/test
    paths:
      - 'modules/dataflows/**'
      - '.github/workflows/dataflows-tests.yml'

jobs:
  test:
    name: Run dataflows OpenTofu tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout messaging-flows
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout common-tools (required sibling module)
        uses: actions/checkout@v4
        with:
          repository: pradeepjykp002/eai-3542753-common-tools-init-pass
          path: eai-3542753-common-tools

      - name: Alias identity pool module path (naming mismatch)
        run: |
          ln -sfn "$GITHUB_WORKSPACE/eai-3542753-common-tools/terraform/eai-identity-pool-acls" \
            "$GITHUB_WORKSPACE/eai-3542753-common-tools/terraform/eai-identity-pool-access"

      - name: Alias flink service account module path (naming mismatch)
        run: |
          ln -sfn "$GITHUB_WORKSPACE/eai-3542753-common-tools/terraform/flink-service-account" \
            "$GITHUB_WORKSPACE/eai-3542753-common-tools/terraform/flink-service-account-access"

      - name: Allow optional flink_credentials input for topic module (compat)
        run: |
          cat > "$GITHUB_WORKSPACE/eai-3542753-common-tools/terraform/topic/flink_credentials.compat.tf" <<'EOF'
          variable "flink_credentials" {
            type    = any
            default = null
          }
          EOF

      - name: Allow optional service_account_id input for flink service account module (compat)
        run: |
          cat > "$GITHUB_WORKSPACE/eai-3542753-common-tools/terraform/flink-service-account/service_account_id.compat.tf" <<'EOF'
          variable "service_account_id" {
            type    = any
            default = null
          }
          EOF

      - name: Link common-tools as sibling of workspace (for local module sources)
        run: |
          ln -sfn "$GITHUB_WORKSPACE/eai-3542753-common-tools" "$GITHUB_WORKSPACE/../eai-3542753-common-tools"

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Determine changed test files
        id: filters
        working-directory: modules/dataflows
        run: |
          # Compare PR head against the merge base on the PR base branch.
          # actions/checkout does not fetch other remote branches by default, so fetch the base ref explicitly.
          BASE_REF="${GITHUB_BASE_REF:-release}"
          git fetch --no-tags --prune --depth=1 origin "$BASE_REF"
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD -- .)

          TEST_FILTERS=""
          RUN_ALL=false

          for file in $CHANGED; do
            rel="$file"

            case "$rel" in
              back-office/topic_*.tf|back-office/flink_statement_*.tf|commercial/topic_*.tf|commercial/flink_statement_*.tf)
                # Derive portfolio_subportfolio from the folder and filename.
                # e.g. back-office/topic_hr.tf           -> back-office_hr
                #      commercial/flink_statement_billing.tf -> commercial_billing
                folder=${rel%%/*}
                base=$(basename "$rel" .tf)
                subportfolio=${base#topic_}
                subportfolio=${subportfolio#flink_statement_}
                portfolio_subportfolio="${folder}_${subportfolio}"
                filter="${portfolio_subportfolio}.tftest.hcl"
                if [ -f "$filter" ]; then
                  if [[ "$TEST_FILTERS" != *"$filter"* ]]; then
                    TEST_FILTERS="$TEST_FILTERS -filter=$filter"
                  fi
                else
                  # No dedicated test file exists for this subportfolio; run all tests.
                  RUN_ALL=true
                fi
                ;;
              back-office/*.tf|back-office/*.tftest.hcl|commercial/*.tf|commercial/*.tftest.hcl)
                # Shared files inside a portfolio folder affect everything there.
                RUN_ALL=true
                ;;
              *)
                # Any other change in modules/dataflows (operations, tech-platforms, shared root files, etc.).
                RUN_ALL=true
                ;;
            esac
          done

          if [ "$RUN_ALL" = "true" ]; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
            echo "test_args=" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$TEST_FILTERS" ]; then
              echo "run_all=true" >> "$GITHUB_OUTPUT"
              echo "test_args=" >> "$GITHUB_OUTPUT"
            else
              echo "run_all=false" >> "$GITHUB_OUTPUT"
              echo "test_args=$TEST_FILTERS" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Initialise and run tests
        working-directory: modules/dataflows
        run: |
          tofu init -backend=false -input=false
          if [ "${{ steps.filters.outputs.run_all }}" = "true" ]; then
            tofu test
          else
            # shellcheck disable=SC2086
            tofu test ${{ steps.filters.outputs.test_args }}
          fi
